name: Refresh Instagram access token

# Instagram long-lived tokens expire 60 days after last refresh, and can
# only be refreshed while still valid — miss the window and you have to
# redo the full OAuth flow by hand. Running twice a month leaves wide
# margin against any single missed/failed run.
on:
  schedule:
    - cron: "0 4 1,15 * *"
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Refresh long-lived token
        id: refresh
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: |
          response=$(curl -s -w "\n%{http_code}" \
            "https://graph.instagram.com/refresh_access_token?grant_type=ig_refresh_token&access_token=${IG_ACCESS_TOKEN}")
          status=$(echo "$response" | tail -n1)
          body=$(echo "$response" | sed '$d')
          echo "HTTP status: $status"

          if [ "$status" != "200" ]; then
            echo "::error::Token refresh failed: $body"
            echo "::error::If the token has fully expired (not refreshed in 60+ days), it must be regenerated by hand via the OAuth flow in SETUP.md."
            exit 1
          fi

          new_token=$(echo "$body" | jq -r '.access_token')
          if [ -z "$new_token" ] || [ "$new_token" = "null" ]; then
            echo "::error::Refresh response missing access_token: $body"
            exit 1
          fi

          echo "::add-mask::$new_token"
          echo "new_token=$new_token" >> "$GITHUB_OUTPUT"

      - name: Store refreshed token as a repo secret
        env:
          GH_TOKEN: ${{ secrets.GH_PAT_SECRETS }}
        run: |
          echo "${{ steps.refresh.outputs.new_token }}" | gh secret set IG_ACCESS_TOKEN --repo "${{ github.repository }}"
          echo "IG_ACCESS_TOKEN secret updated."
