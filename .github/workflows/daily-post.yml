name: Daily Instagram quote post

on:
  schedule:
    - cron: "30 3 * * *"  # 03:30 UTC daily
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Generate and verify the Reel is publicly fetchable, but do not post to Instagram"
        type: boolean
        default: false

concurrency:
  group: daily-instagram-post
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    outputs:
      date: ${{ steps.meta.outputs.date }}
      sha: ${{ steps.commit.outputs.sha }}
      video_url: ${{ steps.commit.outputs.video_url }}
      dry_run: ${{ steps.meta.outputs.dry_run }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - run: pip install -r requirements.txt

      - name: Install ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          ffmpeg -version

      - name: Resolve run metadata
        id: meta
        run: |
          echo "date=$(date -u +%F)" >> "$GITHUB_OUTPUT"
          echo "dry_run=${{ inputs.dry_run || 'false' }}" >> "$GITHUB_OUTPUT"

      - name: Validate Instagram credentials
        if: steps.meta.outputs.dry_run != 'true'
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: python src/publish.py --validate
        working-directory: .

      - name: Generate today's Reel
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: python src/generate.py --date "${{ steps.meta.outputs.date }}"

      - name: Commit generated Reel + state
        id: commit
        run: |
          git config user.name "instagram-daily-quote-bot"
          git config user.email "actions@users.noreply.github.com"
          git add out/ state/
          if git diff --cached --quiet; then
            echo "No changes to commit (Reel for this date already exists)."
          else
            git commit -m "Daily Reel: ${{ steps.meta.outputs.date }}"
            for i in 1 2 3 4 5; do
              if git push; then
                break
              fi
              echo "Push rejected (concurrent commit to main) — rebasing and retrying ($i/5)..."
              git fetch origin main
              git rebase origin/main
              sleep $((RANDOM % 5 + 1))
            done
          fi
          sha=$(git rev-parse HEAD)
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "video_url=https://raw.githubusercontent.com/${{ github.repository }}/$sha/out/${{ steps.meta.outputs.date }}.mp4" >> "$GITHUB_OUTPUT"
          echo "thumb_url=https://raw.githubusercontent.com/${{ github.repository }}/$sha/out/${{ steps.meta.outputs.date }}_thumb.jpg" >> "$GITHUB_OUTPUT"

      - name: Job summary
        run: |
          {
            echo "### Today's Reel — ${{ steps.meta.outputs.date }}"
            echo ""
            echo "![preview](${{ steps.commit.outputs.thumb_url }})"
            echo ""
            echo "[▶ Preview the Reel with audio](${{ steps.commit.outputs.video_url }})"
            echo ""
            echo "**Caption:**"
            echo '```'
            cat "out/${{ steps.meta.outputs.date }}.json" | python3 -c "import json,sys; print(json.load(sys.stdin)['caption'])"
            echo '```'
            echo ""
            echo "Photo credit: $(python3 -c "import json; print(json.load(open('out/${{ steps.meta.outputs.date }}.json'))['photo']['photographer'])")"
            echo ""
            echo "Track: $(python3 -c "import json; print(json.load(open('out/${{ steps.meta.outputs.date }}.json'))['track']['title'])")"
          } >> "$GITHUB_STEP_SUMMARY"

  approve:
    needs: generate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.generate.outputs.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - run: pip install requests

      - name: Wait for Telegram approval
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python -u .github/scripts/telegram_approval.py \
            --run-id "${{ github.run_id }}" \
            --date "${{ needs.generate.outputs.date }}" \
            --caption-file "out/${{ needs.generate.outputs.date }}.json" \
            --video-url "${{ needs.generate.outputs.video_url }}" \
            --dry-run "${{ needs.generate.outputs.dry_run }}" \
            --timeout-minutes 30

  publish:
    needs: [generate, approve]
    if: always() && needs.generate.result == 'success' && (needs.approve.result == 'success' || needs.approve.result == 'skipped')
    runs-on: ubuntu-latest
    environment: instagram-live
    steps:
      # github.sha is frozen for the whole workflow run, so a plain checkout
      # here would silently miss the commit the generate job just pushed —
      # pin explicitly to that commit's SHA.
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.generate.outputs.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - run: pip install -r requirements.txt

      - name: Verify Reel is publicly fetchable
        run: |
          for i in 1 2 3 4 5; do
            status=$(curl -s -o /dev/null -w "%{http_code}" "${{ needs.generate.outputs.video_url }}")
            if [ "$status" == "200" ]; then
              content_type=$(curl -sI "${{ needs.generate.outputs.video_url }}" | grep -i '^content-type' || true)
              echo "HTTP $status — $content_type"
              exit 0
            fi
            echo "HTTP $status on attempt $i/5 — retrying..."
            sleep $((i * 5))
          done
          echo "::error::Video URL is not publicly fetchable after retries (propagation lag or CDN rate limit) — re-run this job."
          exit 1

      - name: Publish to Instagram
        if: needs.generate.outputs.dry_run != 'true'
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: |
          python src/publish.py \
            --video-url "${{ needs.generate.outputs.video_url }}" \
            --caption-file "out/${{ needs.generate.outputs.date }}.json"

      - name: Dry run — skip publish
        if: needs.generate.outputs.dry_run == 'true'
        run: echo "dry_run=true — Reel verified fetchable, Instagram publish skipped."
